<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>💰 Personal Expense Tracker</h1>
            <p>Track your spending, manage budgets, and save money</p>
        </div>

        <div class="dashboard">
            <!-- Left Column -->
            <div>
                <div class="card">
                    <h2>➕ Add New Expense</h2>
                    <div id="alert" class="alert"></div>
                    <form id="expenseForm">
                        <div class="form-group">
                            <label>Amount (₹)</label>
                            <input type="number" id="amount" step="0.01" required placeholder="Enter amount">
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <select id="category" required title="Select the category for the expense">
                                <option value="">Select category</option>
                                <option value="Food">🍔 Food</option>
                                <option value="Transport">🚗 Transport</option>
                                <option value="Shopping">🛍️ Shopping</option>
                                <option value="Entertainment">🎬 Entertainment</option>
                                <option value="Bills">💡 Bills</option>
                                <option value="Healthcare">🏥 Healthcare</option>
                                <option value="Other">📌 Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="description" rows="3" placeholder="What did you spend on?"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Date</label>
                            <input type="date" id="date" title="Select the date of the expense">
                        </div>
                        <button type="submit">Add Expense</button>
                    </form>
                    
                    <div class="action-buttons">
                        <button onclick="expenseTracker.exportToCSV()" class="btn-secondary">📥 Export CSV</button>
                        <button onclick="expenseTracker.clearAllData()" class="btn-warning">🗑️ Clear All Data</button>
                    </div>
                </div>

                <div class="card">
                    <h2>📊 Statistics</h2>
                    <div class="summary-stats">
                        <div class="stat-card">
                            <h3>Total Expenses</h3>
                            <div class="amount" id="totalExpenses">₹0</div>
                        </div>
                        <div class="stat-card">
                            <h3>Categories</h3>
                            <div class="amount" id="categoryCount">0</div>
                        </div>
                        <div class="stat-card">
                            <h3>Transactions</h3>
                            <div class="amount" id="transactionCount">0</div>
                        </div>
                    </div>
                    <div id="categoryBreakdown"></div>
                </div>
            </div>
   <!-- Right Column -->
            <div class="card">
                <h2>📝 Recent Expenses</h2>
                <div id="expensesList" class="expenses-list">
                    <div class="no-expenses">
                        No expenses added yet. Add your first expense!
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
